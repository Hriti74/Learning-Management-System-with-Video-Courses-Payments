<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Platform - Video Courses & Learning Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Styling -->
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="#" onclick="showCatalogue()">
        <i class="bi bi-mortarboard-fill text-primary me-2 fs-4"></i>
        <span>EduStream<span class="text-primary">LMS</span></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" onclick="showCatalogue()"><i class="bi bi-grid me-1"></i> Browse Courses</a>
          </li>
          <li class="nav-item" id="navMyCourses" style="display:none;">
            <a class="nav-link" href="#" onclick="showMyCourses()"><i class="bi bi-journal-bookmark me-1"></i> My Learning</a>
          </li>
          <li class="nav-item" id="navInstructor" style="display:none;">
            <a class="nav-link" href="#" onclick="showInstructor()"><i class="bi bi-person-video3 me-1"></i> Instructor Studio</a>
          </li>
          <li class="nav-item" id="navAdmin" style="display:none;">
            <a class="nav-link" href="#" onclick="showAdmin()"><i class="bi bi-shield-lock me-1"></i> Admin Console</a>
          </li>
        </ul>

        <div class="d-flex align-items-center" id="navRight">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Global Alert Toast / Notification Banner Container -->
  <div class="container mt-3">
    <div id="globalAlert"></div>
  </div>

  <!-- Main Application Root -->
  <main class="container my-4" id="app">
    <!-- Dynamic views rendered via app.js -->
  </main>

  <!-- Standard Footer -->
  <footer class="footer bg-white border-top py-4 mt-5 text-muted small">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <div>
        <strong>EduStream LMS</strong> &copy; 2026. CE1 Capstone Project &bull; Video Courses &amp; Payments.
      </div>
      <div>
        <span class="badge bg-secondary-subtle text-secondary me-2">Node.js Core Streams &amp; Buffers</span>
        <span class="badge bg-secondary-subtle text-secondary me-2">Express REST APIs &amp; JWT</span>
        <span class="badge bg-secondary-subtle text-secondary">EventEmitter</span>
      </div>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Frontend Application Logic -->
  <script src="app.js"></script>
</body>
</html>
